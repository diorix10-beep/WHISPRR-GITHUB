[package]
name = "chimera"
version = "0.1.0"
description = "CHIMERA desktop — characters, stories, worlds, and roleplay"
authors = ["CHIMERA"]
edition = "2021"

[lib]
name = "chimera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
